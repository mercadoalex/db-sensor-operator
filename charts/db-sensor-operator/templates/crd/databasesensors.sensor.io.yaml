{{- if .Values.crd.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: databasesensors.sensor.io
spec:
  group: sensor.io
  names:
    kind: DatabaseSensor
    listKind: DatabaseSensorList
    plural: databasesensors
    shortNames:
    - dbsensor
    singular: databasesensor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.lag
      name: Lag
      type: string
    - jsonPath: .status.eventsPerMin
      name: Events/Min
      type: number
    - jsonPath: .spec.database.type
      name: DB Type
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Last Error
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: DatabaseSensor is the Schema for the databasesensors API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DatabaseSensor
            properties:
              dashboard:
                description: dashboard configures the optional embedded dashboard.
                properties:
                  enabled:
                    default: false
                    description: enabled turns the embedded dashboard (/dashboard,
                      /api/events) on.
                    type: boolean
                  retention:
                    description: |-
                      retention is how long recent events are kept for the dashboard
                      (for example "72h").
                    type: string
                type: object
              database:
                description: database is the connection to the database to monitor.
                properties:
                  host:
                    description: host is the database hostname or service address.
                    minLength: 1
                    type: string
                  name:
                    description: |-
                      name is the logical database to capture (database.dbname). Required by
                      the PostgreSQL connector; ignored by engines that do not take it.
                    type: string
                  passwordSecret:
                    description: |-
                      passwordSecret is the name of a Kubernetes Secret, in the same namespace
                      as the DatabaseSensor, that holds the database password under the key
                      "password". The Secret is injected into the Debezium Server pod as
                      environment variables; the password itself is never written into the
                      DebeziumServer spec.
                    minLength: 1
                    type: string
                  port:
                    description: port is the database port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  type:
                    description: |-
                      type is the database engine to monitor. The value selects the Debezium
                      connector class and any engine-specific configuration. Only PostgreSQL
                      (verified against a real cluster) and MySQL (connector mapped, not yet
                      verified) are supported; other engines are rejected.
                    enum:
                    - postgresql
                    - mysql
                    type: string
                  user:
                    description: user is the database user Debezium connects as.
                    minLength: 1
                    type: string
                required:
                - host
                - passwordSecret
                - port
                - type
                - user
                type: object
              sink:
                description: sink configures the observability backends alerts and
                  metrics fan out to.
                properties:
                  datadog:
                    description: datadog configures the Datadog sink.
                    properties:
                      apiKeySecret:
                        description: apiKeySecret is the name of a Kubernetes Secret
                          holding the Datadog API key.
                        type: string
                      appKeySecret:
                        description: appKeySecret is the name of a Kubernetes Secret
                          holding the Datadog app key.
                        type: string
                      enabled:
                        description: enabled turns the Datadog sink on.
                        type: boolean
                      tags:
                        description: tags are extra tags attached to metrics and alerts
                          pushed to Datadog.
                        items:
                          type: string
                        type: array
                    type: object
                  prometheus:
                    description: prometheus configures the Prometheus sink.
                    properties:
                      alertRules:
                        description: alertRules are the alerting rules rendered into
                          a PrometheusRule.
                        items:
                          description: AlertRule maps a Prometheus alerting rule into
                            a generated PrometheusRule.
                          properties:
                            expr:
                              description: expr is the PromQL expression that triggers
                                the alert.
                              minLength: 1
                              type: string
                            for:
                              description: |-
                                for is the duration the expression must be true before the alert fires
                                (for example "5m").
                              minLength: 1
                              type: string
                            name:
                              description: name is the alert name.
                              minLength: 1
                              type: string
                            severity:
                              description: severity is the alert severity label.
                              enum:
                              - warning
                              - critical
                              type: string
                          required:
                          - expr
                          - for
                          - name
                          - severity
                          type: object
                        type: array
                      namespace:
                        description: |-
                          namespace is where the ServiceMonitor is created. Defaults to the
                          operator Service namespace when empty.
                        type: string
                      serviceMonitor:
                        description: |-
                          serviceMonitor controls whether a ServiceMonitor (and its backing
                          Service) is created for Prometheus to scrape the operator.
                        type: boolean
                    type: object
                  type:
                    description: type selects which sinks are active.
                    enum:
                    - prometheus
                    - datadog
                    - webhook
                    - all
                    type: string
                  webhook:
                    description: webhook configures the webhook sink.
                    properties:
                      enabled:
                        description: enabled turns the webhook sink on.
                        type: boolean
                      triggerOn:
                        description: triggerOn lists the alert names whose firing
                          triggers a webhook POST.
                        items:
                          type: string
                        type: array
                      url:
                        description: url is the webhook endpoint that receives the
                          alert JSON payload.
                        type: string
                    type: object
                type: object
              snapshot:
                description: |-
                  snapshot configures how the Debezium connector starts and how it keeps its
                  position across restarts (ADR-014). An omitted block keeps today's behaviour.
                properties:
                  inspection:
                    description: |-
                      inspection configures the read-only inspection of the database that feeds the
                      diagnostics in status.snapshot.inspection. It is off unless enabled.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          enabled turns the inspection on. When off (the default) the operator opens no
                          connection to the database and creates no inspection Job.
                        type: boolean
                      intervalSeconds:
                        default: 600
                        description: |-
                          intervalSeconds is how often the database is inspected again. 0 inspects once per
                          change of the spec. A positive value must be at least 60 so a typo cannot turn the
                          inspection into a load on the database.
                        format: int32
                        maximum: 86400
                        minimum: 0
                        type: integer
                        x-kubernetes-validations:
                        - message: intervalSeconds must be 0 or at least 60
                          rule: self == 0 || self >= 60
                      timeoutSeconds:
                        default: 30
                        description: |-
                          timeoutSeconds is the deadline of one inspection Job. It bounds the Job, not the
                          reconcile, which never waits for it.
                        format: int32
                        maximum: 300
                        minimum: 5
                        type: integer
                    type: object
                  offsetStore:
                    default: memory
                    description: |-
                      offsetStore selects where Debezium keeps its position in the change log.
                      "memory" (default) is lost when the Debezium pod restarts, so a restart
                      can re-deliver events the operator already counted. "persistent" stores the
                      offset on a PersistentVolumeClaim created by the Debezium Operator, so a
                      restart resumes where it stopped. Switching to "persistent" on a running
                      sensor recreates the Debezium pod with a new volume.
                    enum:
                    - memory
                    - persistent
                    type: string
                type: object
              tables:
                description: tables are the tables to capture changes from.
                items:
                  type: string
                minItems: 1
                type: array
              thresholds:
                description: |-
                  thresholds overrides the per-sensor health thresholds (lag warning/critical
                  and no-event warning/failure timeouts). Each field falls back to the
                  operator default when unset, so an omitted block keeps today's behaviour.
                properties:
                  lagCrit:
                    default: 2m
                    description: |-
                      lagCrit is the replication-lag critical threshold; lag above it moves the
                      sensor to Failed (for example "2m"). Defaults to 2m.
                    type: string
                  lagWarn:
                    default: 30s
                    description: |-
                      lagWarn is the replication-lag warning threshold; lag at or above it moves
                      the sensor to Degraded (for example "30s"). Defaults to 30s.
                    type: string
                  noEventFail:
                    default: 30m
                    description: |-
                      noEventFail is how long without a CDC event moves the sensor to Failed
                      (for example "30m"). Defaults to 30m.
                    type: string
                  noEventWarn:
                    default: 5m
                    description: |-
                      noEventWarn is how long without a CDC event moves the sensor to Degraded
                      (for example "5m"). Defaults to 5m.
                    type: string
                type: object
              transport:
                description: |-
                  transport configures how Debezium CDC events are delivered to the
                  operator. It is the event ingress and is orthogonal to spec.sink (which
                  is the metrics/alert egress) per ADR-012. Defaults to the HTTP transport.
                properties:
                  http:
                    description: http configures the HTTP transport; ignored when
                      type is "kafka".
                    properties:
                      url:
                        description: |-
                          url is the operator's CDC ingestion endpoint that the Debezium Server
                          HTTP sink POSTs events to (for example
                          "http://db-sensor-operator.db-sensor.svc:8080/cdc"). When empty, the
                          generated DebeziumServer keeps a placeholder sink and delivers nothing;
                          that is only appropriate for the synthetic demo, which POSTs events
                          to /cdc itself.
                        type: string
                    type: object
                  kafka:
                    description: kafka configures the Kafka transport; ignored when
                      type is "http".
                    properties:
                      brokers:
                        description: brokers is the list of Kafka bootstrap broker
                          addresses.
                        items:
                          type: string
                        type: array
                      groupId:
                        description: groupId is the Kafka consumer group the operator
                          joins.
                        type: string
                      topic:
                        description: |-
                          topic is the explicit topic to consume; takes precedence over
                          topicPrefix when set.
                        type: string
                      topicPrefix:
                        description: topicPrefix is the prefix Debezium uses for its
                          event topics.
                        type: string
                    type: object
                  type:
                    default: http
                    description: |-
                      type selects the event transport: "http" (default, no broker required)
                      or "kafka".
                    enum:
                    - http
                    - kafka
                    type: string
                type: object
            required:
            - database
            - tables
            type: object
            x-kubernetes-validations:
            - message: spec.snapshot.inspection is only available for postgresql
              rule: '!(has(self.snapshot) && has(self.snapshot.inspection) && self.snapshot.inspection.enabled)
                || self.database.type == ''postgresql'''
            - message: spec.snapshot.inspection requires spec.database.name
              rule: '!(has(self.snapshot) && has(self.snapshot.inspection) && self.snapshot.inspection.enabled)
                || (has(self.database.name) && size(self.database.name) > 0)'
          status:
            description: status defines the observed state of DatabaseSensor
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the DatabaseSensor resource and
                  are the source of truth for health and readiness. Error state is carried
                  by a condition's reason/message rather than a dedicated field.

                  Standard condition types include:
                  - "Ready": the sensor is healthy end-to-end
                  - "DebeziumAvailable": the child DebeziumServer pod is running
                  - "ReceivingEvents": CDC events have arrived within the no-event timeout
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              debeziumServer:
                description: debeziumServer is the name of the managed DebeziumServer
                  resource.
                type: string
              eventsPerMin:
                description: eventsPerMin is the current CDC event rate per minute.
                type: number
              lag:
                description: lag is the current replication lag as a duration string
                  (for example "1m30s").
                type: string
              lastEvent:
                description: lastEvent is the timestamp of the most recent CDC event
                  received.
                format: date-time
                type: string
              phase:
                description: |-
                  phase is a convenience summary derived from Conditions on each reconcile.
                  One of: Pending, Running, Degraded, Failed.
                type: string
              snapshot:
                description: |-
                  snapshot reports how the connector starts and where it keeps its offset,
                  with a one-line reason (ADR-014). It is derived from the spec, so it is
                  present even when the sensor is not healthy.
                properties:
                  inspection:
                    description: |-
                      inspection holds the facts the last inspection observed. It is facts only: what the
                      user asked for lives in spec.snapshot.inspection.
                    properties:
                      error:
                        description: |-
                          error is why the last inspection produced no facts, empty when it succeeded.
                          It never contains credentials.
                        type: string
                      factsVersion:
                        description: |-
                          factsVersion is the version of this facts layout. A status written by an older or newer
                          operator with a different layout must not be trusted field by field.
                        format: int32
                        type: integer
                      observedAt:
                        description: |-
                          observedAt is when the inspection finished, taken from the inspection Job, not from
                          the reconcile that read it.
                        format: date-time
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration is the generation of the spec that was inspected. The facts are
                          stale once metadata.generation moves past it.
                        format: int64
                        type: integer
                      postgres:
                        description: |-
                          postgres holds the PostgreSQL-only facts. It is absent for other engines, and absent
                          also when the facts could not be read; status.conditions says which.
                        properties:
                          inRecovery:
                            description: inRecovery is true when the server is a standby.
                            type: boolean
                          maxSlotWalKeepSize:
                            description: |-
                              maxSlotWalKeepSize is the cap, in bytes, on WAL a replication slot may retain. -1 means
                              unlimited, so the free space of pg_wal is the only bound. Absent means it could not be
                              read, for example before PostgreSQL 13.
                            format: int64
                            type: integer
                          replicationSlot:
                            description: |-
                              replicationSlot describes the connector's slot. Absent when it does not exist yet or
                              could not be read; it is never a zeroed object standing for "no slot".
                            properties:
                              active:
                                description: active is true while a connector is attached
                                  to the slot.
                                type: boolean
                              confirmedLagBytes:
                                description: |-
                                  confirmedLagBytes is how far the connector's last confirmed position trails the current
                                  WAL position, absent when unknown. A single reading does not show a stalled connector.
                                format: int64
                                type: integer
                              name:
                                description: name is the slot's name.
                                type: string
                              retainedBytes:
                                description: |-
                                  retainedBytes is the WAL kept for the slot, absent when unknown. It is cluster-wide WAL,
                                  not only the captured tables.
                                format: int64
                                type: integer
                              safeWalSize:
                                description: |-
                                  safeWalSize is PostgreSQL's own margin before the slot is at risk, in bytes. It is negative
                                  once max_slot_wal_keep_size is exceeded (how far past it the slot is) and absent while that
                                  cap is -1, because there is then nothing to measure against. It is not exactly the cap minus
                                  retainedBytes, so it carries information the other two do not.
                                format: int64
                                type: integer
                              walStatus:
                                description: 'walStatus is PostgreSQL''s own judgment:
                                  reserved, extended, unreserved or lost.'
                                type: string
                            required:
                            - active
                            - name
                            type: object
                          serverVersion:
                            description: serverVersion is server_version_num, for
                              example 160015.
                            format: int32
                            type: integer
                          walLevel:
                            description: walLevel is the server's wal_level; logical
                              decoding needs "logical".
                            type: string
                        required:
                        - inRecovery
                        type: object
                      tables:
                        description: tables are the facts of each monitored table,
                          common to every engine.
                        items:
                          description: TableInspection are the facts of one monitored
                            table.
                          properties:
                            canWrite:
                              description: canWrite is whether the connection may
                                create a signaling table in the table's schema.
                              type: boolean
                            estimateReliable:
                              description: estimateReliable is false when the statistics
                                behind estimatedRows are stale or missing.
                              type: boolean
                            estimatedRows:
                              description: estimatedRows is the row estimate, absent
                                when unknown.
                              format: int64
                              type: integer
                            found:
                              description: found is false when the table does not
                                exist.
                              type: boolean
                            name:
                              description: name is the table as named in spec.tables.
                              type: string
                          required:
                          - canWrite
                          - estimateReliable
                          - found
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      truncated:
                        description: |-
                          truncated is true when the result did not fit the inspection Job's termination message
                          and some tables are missing from tables.
                        type: boolean
                    required:
                    - factsVersion
                    type: object
                  offsetStore:
                    description: 'offsetStore is the offset store in effect: "memory"
                      or "persistent".'
                    type: string
                  plan:
                    description: |-
                      plan is what the backfill policy would do per table. It is information, not
                      execution: nothing consumes backfilled rows yet, so applied is always false.
                    properties:
                      applied:
                        description: applied is false until something consumes backfilled
                          rows; the plan is information only.
                        type: boolean
                      tables:
                        description: tables is the decision per table.
                        items:
                          description: TablePlan is the policy's decision for one
                            table.
                          properties:
                            backfill:
                              description: |-
                                backfill is the capture strategy: whether and how existing rows would be delivered after
                                the connector has started. It is independent of the start mode in status.snapshot.strategy.
                              enum:
                              - stream-only
                              - signal-table
                              - read-only-incremental
                              - none
                              type: string
                            name:
                              description: name is the table as named in spec.tables.
                              type: string
                            reason:
                              description: reason is one line explaining the decision.
                                It carries no credentials or row data.
                              type: string
                          required:
                          - backfill
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                    required:
                    - applied
                    type: object
                  reason:
                    description: |-
                      reason is a one-line explanation of the strategy and its consequences.
                      It never contains secret values or row data.
                    type: string
                  strategy:
                    description: |-
                      strategy is the START MODE of the connector: "no-data" (it starts without reading
                      existing rows) or "engine-default" (the Debezium default snapshot applies). It is not
                      the capture strategy. Whether and how existing rows would be delivered is
                      plan.tables[].backfill. The two sound alike and mean different things: starting without
                      reading rows is how every path begins, including the ones that backfill afterwards.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
