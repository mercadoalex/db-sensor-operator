---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: databasesensors.sensor.io
spec:
  group: sensor.io
  names:
    kind: DatabaseSensor
    listKind: DatabaseSensorList
    plural: databasesensors
    shortNames:
    - dbsensor
    singular: databasesensor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.lag
      name: Lag
      type: string
    - jsonPath: .status.eventsPerMin
      name: Events/Min
      type: number
    - jsonPath: .spec.database.type
      name: DB Type
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Last Error
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: DatabaseSensor is the Schema for the databasesensors API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DatabaseSensor
            properties:
              dashboard:
                description: dashboard configures the optional embedded dashboard.
                properties:
                  enabled:
                    default: false
                    description: enabled turns the embedded dashboard (/dashboard,
                      /api/events) on.
                    type: boolean
                  retention:
                    description: |-
                      retention is how long recent events are kept for the dashboard
                      (for example "72h").
                    type: string
                type: object
              database:
                description: database is the connection to the database to monitor.
                properties:
                  host:
                    description: host is the database hostname or service address.
                    minLength: 1
                    type: string
                  passwordSecret:
                    description: |-
                      passwordSecret is the name of a Kubernetes Secret, in the same namespace
                      as the DatabaseSensor, that holds the database password.
                    minLength: 1
                    type: string
                  port:
                    description: port is the database port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  type:
                    description: |-
                      type is the database engine to monitor. The value selects the Debezium
                      connector class and any engine-specific configuration.
                    enum:
                    - postgresql
                    - mysql
                    - mongodb
                    - sqlserver
                    - oracle
                    - db2
                    - cassandra
                    type: string
                  user:
                    description: user is the database user Debezium connects as.
                    minLength: 1
                    type: string
                required:
                - host
                - passwordSecret
                - port
                - type
                - user
                type: object
              sink:
                description: sink configures the observability backends alerts and
                  metrics fan out to.
                properties:
                  datadog:
                    description: datadog configures the Datadog sink.
                    properties:
                      apiKeySecret:
                        description: apiKeySecret is the name of a Kubernetes Secret
                          holding the Datadog API key.
                        type: string
                      appKeySecret:
                        description: appKeySecret is the name of a Kubernetes Secret
                          holding the Datadog app key.
                        type: string
                      enabled:
                        description: enabled turns the Datadog sink on.
                        type: boolean
                      tags:
                        description: tags are extra tags attached to metrics and alerts
                          pushed to Datadog.
                        items:
                          type: string
                        type: array
                    type: object
                  prometheus:
                    description: prometheus configures the Prometheus sink.
                    properties:
                      alertRules:
                        description: alertRules are the alerting rules rendered into
                          a PrometheusRule.
                        items:
                          description: AlertRule maps a Prometheus alerting rule into
                            a generated PrometheusRule.
                          properties:
                            expr:
                              description: expr is the PromQL expression that triggers
                                the alert.
                              minLength: 1
                              type: string
                            for:
                              description: |-
                                for is the duration the expression must be true before the alert fires
                                (for example "5m").
                              minLength: 1
                              type: string
                            name:
                              description: name is the alert name.
                              minLength: 1
                              type: string
                            severity:
                              description: severity is the alert severity label.
                              enum:
                              - warning
                              - critical
                              type: string
                          required:
                          - expr
                          - for
                          - name
                          - severity
                          type: object
                        type: array
                      namespace:
                        description: |-
                          namespace is where the ServiceMonitor is created. Defaults to the
                          operator Service namespace when empty.
                        type: string
                      serviceMonitor:
                        description: |-
                          serviceMonitor controls whether a ServiceMonitor (and its backing
                          Service) is created for Prometheus to scrape the operator.
                        type: boolean
                    type: object
                  type:
                    description: type selects which sinks are active.
                    enum:
                    - prometheus
                    - datadog
                    - webhook
                    - all
                    type: string
                  webhook:
                    description: webhook configures the webhook sink.
                    properties:
                      enabled:
                        description: enabled turns the webhook sink on.
                        type: boolean
                      triggerOn:
                        description: triggerOn lists the alert names whose firing
                          triggers a webhook POST.
                        items:
                          type: string
                        type: array
                      url:
                        description: url is the webhook endpoint that receives the
                          alert JSON payload.
                        type: string
                    type: object
                type: object
              tables:
                description: tables are the tables to capture changes from.
                items:
                  type: string
                minItems: 1
                type: array
              thresholds:
                description: |-
                  thresholds overrides the per-sensor health thresholds (lag warning/critical
                  and no-event warning/failure timeouts). Each field falls back to the
                  operator default when unset, so an omitted block keeps today's behaviour.
                properties:
                  lagCrit:
                    default: 2m
                    description: |-
                      lagCrit is the replication-lag critical threshold; lag above it moves the
                      sensor to Failed (for example "2m"). Defaults to 2m.
                    type: string
                  lagWarn:
                    default: 30s
                    description: |-
                      lagWarn is the replication-lag warning threshold; lag at or above it moves
                      the sensor to Degraded (for example "30s"). Defaults to 30s.
                    type: string
                  noEventFail:
                    default: 30m
                    description: |-
                      noEventFail is how long without a CDC event moves the sensor to Failed
                      (for example "30m"). Defaults to 30m.
                    type: string
                  noEventWarn:
                    default: 5m
                    description: |-
                      noEventWarn is how long without a CDC event moves the sensor to Degraded
                      (for example "5m"). Defaults to 5m.
                    type: string
                type: object
              transport:
                description: |-
                  transport configures how Debezium CDC events are delivered to the
                  operator. It is the event ingress and is orthogonal to spec.sink (which
                  is the metrics/alert egress) per ADR-012. Defaults to the HTTP transport.
                properties:
                  kafka:
                    description: kafka configures the Kafka transport; ignored when
                      type is "http".
                    properties:
                      brokers:
                        description: brokers is the list of Kafka bootstrap broker
                          addresses.
                        items:
                          type: string
                        type: array
                      groupId:
                        description: groupId is the Kafka consumer group the operator
                          joins.
                        type: string
                      topic:
                        description: |-
                          topic is the explicit topic to consume; takes precedence over
                          topicPrefix when set.
                        type: string
                      topicPrefix:
                        description: topicPrefix is the prefix Debezium uses for its
                          event topics.
                        type: string
                    type: object
                  type:
                    default: http
                    description: |-
                      type selects the event transport: "http" (default, no broker required)
                      or "kafka".
                    enum:
                    - http
                    - kafka
                    type: string
                type: object
            required:
            - database
            - tables
            type: object
          status:
            description: status defines the observed state of DatabaseSensor
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the DatabaseSensor resource and
                  are the source of truth for health and readiness. Error state is carried
                  by a condition's reason/message rather than a dedicated field.

                  Standard condition types include:
                  - "Ready": the sensor is healthy end-to-end
                  - "DebeziumAvailable": the child DebeziumServer pod is running
                  - "ReceivingEvents": CDC events have arrived within the no-event timeout
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              debeziumServer:
                description: debeziumServer is the name of the managed DebeziumServer
                  resource.
                type: string
              eventsPerMin:
                description: eventsPerMin is the current CDC event rate per minute.
                type: number
              lag:
                description: lag is the current replication lag as a duration string
                  (for example "1m30s").
                type: string
              lastEvent:
                description: lastEvent is the timestamp of the most recent CDC event
                  received.
                format: date-time
                type: string
              phase:
                description: |-
                  phase is a convenience summary derived from Conditions on each reconcile.
                  One of: Pending, Running, Degraded, Failed.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
