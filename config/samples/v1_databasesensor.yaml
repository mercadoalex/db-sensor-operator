apiVersion: sensor.io/v1
kind: DatabaseSensor
metadata:
  labels:
    app.kubernetes.io/name: db-sensor-operator
    app.kubernetes.io/managed-by: kustomize
  name: databasesensor-sample
spec:
  database:
    type: postgresql
    host: postgres-svc.prod
    port: 5432
    user: debezium
    passwordSecret: db-creds
  tables:
    - orders
    - users
    - payments
  # transport is the Debezium event ingress (ADR-012), orthogonal to sink below.
  # Defaults to http (no broker required). To use Kafka instead, set type: kafka
  # and uncomment the kafka block:
  transport:
    type: http # http | kafka
    # kafka:
    #   brokers:
    #     - kafka-bootstrap.kafka:9092
    #   topicPrefix: dbsensor
    #   groupId: db-sensor-operator
  sink:
    type: all # prometheus | datadog | webhook | all
    prometheus:
      namespace: monitoring
      serviceMonitor: true
      alertRules:
        - name: HighLag
          expr: "debezium_lag_seconds > 30"
          for: 5m
          severity: warning
        - name: NoEvents
          expr: "rate(debezium_events_total[5m]) == 0"
          for: 15m
          severity: critical
    datadog:
      enabled: true
      apiKeySecret: dd-api-key
      appKeySecret: dd-app-key
      tags:
        - "env:prod"
        - "db:postgres"
    webhook:
      enabled: true
      url: https://hooks.slack.com/services/XXX
      triggerOn:
        - HighLag
        - NoEvents
  dashboard:
    enabled: true
    retention: 72h
