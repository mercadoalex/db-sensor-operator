---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - sensor.io
  resources:
  - databasesensors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sensor.io
  resources:
  - databasesensors/finalizers
  verbs:
  - update
- apiGroups:
  - sensor.io
  resources:
  - databasesensors/status
  verbs:
  - get
  - patch
  - update
