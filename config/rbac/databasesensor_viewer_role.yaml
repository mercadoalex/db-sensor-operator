# This rule is not used by the project db-sensor-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sensor.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: db-sensor-operator
    app.kubernetes.io/managed-by: kustomize
  name: databasesensor-viewer-role
rules:
- apiGroups:
  - sensor.io
  resources:
  - databasesensors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sensor.io
  resources:
  - databasesensors/status
  verbs:
  - get
