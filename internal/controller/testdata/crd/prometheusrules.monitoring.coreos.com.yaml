# Minimal PrometheusRule CRD for envtest only.
#
# The full upstream CRD (prometheusrules.monitoring.coreos.com) is large; this
# loose schema (spec with x-kubernetes-preserve-unknown-fields) is enough for
# envtest to accept the typed monitoringv1.PrometheusRule the metrics package
# builds and to genuinely verify CreateOrUpdate + owner-reference GC.
#
# This file lives under the controller test tree, NOT config/crd/bases (that dir
# is generated and owned by our own CRD). It mirrors the structure of
# servicemonitors.monitoring.coreos.com.yaml.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prometheusrules.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: PrometheusRule
    listKind: PrometheusRuleList
    plural: prometheusrules
    singular: prometheusrule
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
