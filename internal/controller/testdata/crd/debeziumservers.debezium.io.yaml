# Minimal DebeziumServer CRD for envtest only.
#
# The full upstream CRD (debeziumservers.debezium.io, ~104 KB) is not vendored.
# Because spec.source / spec.sink are x-kubernetes-preserve-unknown-fields objects
# upstream, this loose schema is enough for envtest to accept the object the
# deployer builds and to genuinely verify CreateOrUpdate + owner-reference GC.
#
# This file lives under the controller test tree, NOT config/crd/bases (that dir
# is generated and owned by our own CRD).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: debeziumservers.debezium.io
spec:
  group: debezium.io
  names:
    kind: DebeziumServer
    listKind: DebeziumServerList
    plural: debeziumservers
    singular: debeziumserver
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                source:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                sink:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
