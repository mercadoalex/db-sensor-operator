# Minimal ServiceMonitor CRD for envtest only.
#
# The full upstream CRD (servicemonitors.monitoring.coreos.com) is large; this
# loose schema (spec with x-kubernetes-preserve-unknown-fields) is enough for
# envtest to accept the typed monitoringv1.ServiceMonitor the metrics package
# builds and to genuinely verify CreateOrUpdate + owner-reference GC.
#
# This file lives under the controller test tree, NOT config/crd/bases (that dir
# is generated and owned by our own CRD). It follows the Task 4 pattern of
# debeziumservers.debezium.io.yaml.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: ServiceMonitor
    listKind: ServiceMonitorList
    plural: servicemonitors
    singular: servicemonitor
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
