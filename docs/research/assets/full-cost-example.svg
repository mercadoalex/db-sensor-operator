<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#09090b">Una fila con una nota larga: por qué cuesta 36 veces más</text>
  <text x="40" y="64" font-size="13" fill="#52525b">Ejemplo: una fila de "pedido" con una nota de unos 6,4 KB guardada aparte (TOAST). Se actualiza solo el precio (amount); la nota no se toca.</text>

  <!-- how it is stored at rest -->
  <text x="40" y="100" font-size="15" font-weight="700" fill="#09090b">Cómo se guarda, antes de que nadie la toque</text>

  <rect x="40" y="115" width="430" height="110" rx="8" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="60" y="136" font-size="12" font-weight="600" fill="#09090b">Tabla "orders" (filas normales)</text>
  <rect x="60" y="148" width="60" height="26" fill="#e4e4e7" stroke="#a1a1aa"/>
  <text x="90" y="165" font-size="10" text-anchor="middle" fill="#3f3f46">id=4711</text>
  <rect x="124" y="148" width="80" height="26" fill="#fde68a" stroke="#d97706"/>
  <text x="164" y="165" font-size="10" text-anchor="middle" fill="#78350f" font-weight="700">amount=149.99</text>
  <rect x="208" y="148" width="100" height="26" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="258" y="165" font-size="10" text-anchor="middle" fill="#4c1d95" font-weight="700">note = ficha (18 B)</text>
  <text x="60" y="195" font-size="18" font-weight="700" fill="#09090b">53 bytes en total</text>
  <text x="60" y="213" font-size="11" fill="#71717a">(encabezado + id + amount + la ficha de 18 B. No el texto.)</text>

  <path d="M 470 178 L 540 178" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="168" font-size="10" text-anchor="middle" fill="#7c3aed">apunta a</text>

  <rect x="550" y="115" width="610" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="570" y="136" font-size="12" font-weight="600" fill="#09090b">Tabla TOAST (solo columnas grandes, aparte)</text>
  <rect x="570" y="148" width="110" height="26" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="625" y="165" font-size="10" text-anchor="middle" fill="#4c1d95">chunk_id 16411</text>
  <rect x="685" y="148" width="100" height="26" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="735" y="165" font-size="10" text-anchor="middle" fill="#4c1d95">trozo 0 de la nota</text>
  <rect x="790" y="148" width="100" height="26" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="840" y="165" font-size="10" text-anchor="middle" fill="#4c1d95">trozo 1 de la nota</text>
  <rect x="895" y="148" width="100" height="26" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="945" y="165" font-size="10" text-anchor="middle" fill="#4c1d95">… más trozos</text>
  <text x="570" y="195" font-size="18" font-weight="700" fill="#09090b">unos 6.400 bytes en total</text>
  <text x="570" y="213" font-size="11" fill="#71717a">(el texto real de la nota, partido en varios pedazos)</text>

  <!-- DEFAULT path -->
  <text x="40" y="270" font-size="15" font-weight="700" fill="#09090b">Se actualiza el precio, identidad por defecto (sin FULL)</text>
  <text x="40" y="290" font-size="12" fill="#52525b">La ficha de 18 bytes no cambió, así que ni se vuelve a escribir. El texto de la nota no se toca para nada.</text>

  <rect x="40" y="305" width="1120" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="60" y="318" width="70" height="28" fill="#e4e4e7" stroke="#a1a1aa"/>
  <text x="95" y="336" font-size="10" text-anchor="middle" fill="#3f3f46">id</text>
  <rect x="140" y="318" width="110" height="28" fill="#fde68a" stroke="#d97706"/>
  <text x="195" y="336" font-size="10" text-anchor="middle" fill="#78350f" font-weight="700">amount (nuevo)</text>
  <rect x="260" y="318" width="200" height="28" fill="#f4f4f5" stroke="#d4d4d8" stroke-dasharray="4 3"/>
  <text x="360" y="336" font-size="10" text-anchor="middle" fill="#a1a1aa">ficha de note: no cambió</text>
  <text x="950" y="340" font-size="18" font-weight="700" fill="#16a34a">186 bytes</text>

  <!-- FULL path -->
  <text x="40" y="400" font-size="15" font-weight="700" fill="#09090b">El mismo cambio, con REPLICA IDENTITY FULL</text>
  <text x="40" y="420" font-size="12" fill="#52525b">Se tiene que guardar la fila completa de antes Y de después, y "completa" aquí incluye el TEXTO de la nota, no solo la ficha.</text>

  <rect x="40" y="435" width="1120" height="55" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <rect x="60" y="448" width="70" height="28" fill="#e4e4e7" stroke="#a1a1aa"/>
  <text x="95" y="466" font-size="10" text-anchor="middle" fill="#3f3f46">id</text>
  <rect x="140" y="448" width="110" height="28" fill="#fde68a" stroke="#d97706"/>
  <text x="195" y="466" font-size="10" text-anchor="middle" fill="#78350f" font-weight="700">amount (viejo)</text>
  <rect x="260" y="448" width="650" height="28" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="585" y="466" font-size="10" text-anchor="middle" fill="#4c1d95" font-weight="700">el TEXTO completo de la nota (no la ficha), sin haber cambiado</text>
  <text x="1030" y="467" font-size="16" font-weight="700" fill="#dc2626">+</text>

  <rect x="40" y="500" width="1120" height="55" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <rect x="60" y="513" width="70" height="28" fill="#e4e4e7" stroke="#a1a1aa"/>
  <text x="95" y="531" font-size="10" text-anchor="middle" fill="#3f3f46">id</text>
  <rect x="140" y="513" width="110" height="28" fill="#fde68a" stroke="#d97706"/>
  <text x="195" y="531" font-size="10" text-anchor="middle" fill="#78350f" font-weight="700">amount (nuevo)</text>
  <rect x="260" y="513" width="650" height="28" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="585" y="531" font-size="10" text-anchor="middle" fill="#4c1d95" font-weight="700">el TEXTO completo de la nota (no la ficha), sin haber cambiado</text>
  <text x="950" y="560" font-size="18" font-weight="700" fill="#dc2626">6.637 bytes</text>

  <!-- comparison -->
  <rect x="40" y="600" width="1120" height="160" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="60" y="630" font-size="14" font-weight="700" fill="#09090b">Mismo UPDATE, mismo cambio real (solo el precio). La diferencia es cuánto hay que escribir en el WAL.</text>

  <text x="60" y="670" font-size="12" fill="#3f3f46">Por defecto</text>
  <rect x="150" y="656" width="4" height="22" fill="#16a34a"/>
  <text x="165" y="673" font-size="18" font-weight="700" fill="#16a34a">186 B</text>

  <text x="340" y="670" font-size="12" fill="#3f3f46">Con FULL</text>
  <rect x="420" y="652" width="140" height="26" fill="#fecaca"/>
  <text x="565" y="673" font-size="18" font-weight="700" fill="#dc2626">6.637 B</text>

  <text x="60" y="712" font-size="14" font-weight="700" fill="#09090b">36 veces más WAL, por una columna que ni siquiera cambió.</text>
  <text x="60" y="735" font-size="11" fill="#71717a">Bytes del heap (53 B con el puntero) y el tamaño del puntero (18 B) verificados en PostgreSQL 16 real para este documento.</text>
  <text x="60" y="750" font-size="11" fill="#71717a">Bytes de WAL (186 / 6.637) del experimento: bench/experiments/replica-identity-full-cost/RESULTS.md — fila sintética de prueba.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
