# A throwaway PostgreSQL 16 host for the WAL cost measurement; run.sh creates the cluster inside it.
apiVersion: v1
kind: Pod
metadata:
  name: fullcost-pg
  labels:
    app: fullcost-pg
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 999
    runAsGroup: 999
  containers:
    - name: pg
      image: postgres:16
      command: ["sleep", "infinity"]
      env:
        - name: PATH
          value: /usr/lib/postgresql/16/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
