# EventSource (Kafka) + Sensor (data filter) + trigger (patch a Job: suspend it) + RBAC + the Job to stop.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata: { name: payments-cdc, namespace: argo-events }
spec:
  kafka:
    payments:
      url: argo-kafka.bench.svc.cluster.local:9092
      topic: argotest.public.payments
      jsonBody: true
      consumerGroup: { groupName: argo-events-payments }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: job-suspender, namespace: argo-events }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: job-suspender, namespace: bench }
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: job-suspender, namespace: bench }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: job-suspender }
subjects:
  - { kind: ServiceAccount, name: job-suspender, namespace: argo-events }
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata: { name: settled-to-pending, namespace: argo-events }
spec:
  template:
    serviceAccountName: job-suspender
  dependencies:
    - name: forbidden-transition
      eventSourceName: payments-cdc
      eventName: payments
      filters:
        data:
          - { path: body.before.status, type: string, value: ["settled"] }
          - { path: body.after.status,  type: string, value: ["pending"] }
  triggers:
    - template:
        name: suspend-payments-writer
        k8s:
          operation: patch
          patchStrategy: application/merge-patch+json
          source:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata: { name: payments-writer, namespace: bench }
              spec: { suspend: true }
---
apiVersion: batch/v1
kind: Job
metadata: { name: payments-writer, namespace: bench }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - { name: writer, image: busybox:1.36, command: ["sh", "-c", "echo running; sleep 3600"] }
