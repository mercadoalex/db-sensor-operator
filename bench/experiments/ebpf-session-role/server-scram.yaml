# A throwaway PostgreSQL 16 host for the auth-handshake experiment (auth-handshake.sh). One instance, SCRAM-SHA-256
# required for the test role, so the handshake the probe captures is the real one, not trust.
apiVersion: v1
kind: Pod
metadata:
  name: ebpf-pg-scram
  labels:
    app: ebpf-pg-scram
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 999
    runAsGroup: 999
  containers:
    - name: pg
      image: postgres:16
      command: ["sleep", "infinity"]
      env:
        - name: PATH
          value: /usr/lib/postgresql/16/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
