# A throwaway PostgreSQL 16 host: run.sh starts two instances inside it (plain on 5432, TLS on 5433).
# Both log every statement (log_statement=all) so the server side can be compared with what the probe sees.
apiVersion: v1
kind: Pod
metadata:
  name: ebpf-pg
  labels:
    app: ebpf-pg
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 999
    runAsGroup: 999
  containers:
    - name: pg
      image: postgres:16
      command: ["sleep", "infinity"]
      env:
        - name: PATH
          value: /usr/lib/postgresql/16/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
