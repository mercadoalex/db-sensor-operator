name: Deck (GitHub Pages)

# Publishes the HTML deck (docs/overview/deck.html and its slide SVGs) to GitHub Pages.
# Only those files are copied into the site. In particular docs/overview/deck-notes.js
# (the presenter notes, git-ignored) is never published.

on:
  push:
    branches: [main]
    paths:
      - docs/overview/deck.html
      - docs/overview/findings-slide-*.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir _site
          cp docs/overview/deck.html _site/index.html
          cp docs/overview/findings-slide-*.svg _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
